<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Обратная связь</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; padding: 20px; max-width: 600px; margin: auto; text-align: center; background-color: #000000;font-family: 'Courier New', monospace;}
        input, textarea, select { width: 100%; padding: 8px; margin: 5px 0; background-color: #262626; color: #ffcc00;font-family: 'Courier New', monospace;}
        button { padding: 10px 20px; background: #ffcc00; color: black; border: none; cursor: pointer; font-family: 'Courier New', monospace;}
        button:hover { background: #ffcc00; }
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #fff;
            z-index: 1000;
            background-color: #ffcc00;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <a href="/feedback" style="color: #000000; text-underline-offset: auto; text-decoration: none;">Написать новое</a>
        <a href="/promo" style="color: #000000; text-underline-offset: auto; text-decoration: none;">Ввести промокод</a>
        <p></p>
        <a href="/tops" style="color: #000000; text-underline-offset: auto; text-decoration: none;">Лучшие авторы</a>
        <a href="https://t.me/+Al3PSSStlsM2ZmIy" style="color: #000000; text-underline-offset: auto; text-decoration: none;">Наш телеграмм канал</a>
    </header>
    <h1>Оставить сообщение</h1>
    <form action="/feedback" method="post">
        <input type="text" name="name" placeholder="Ваше имя" required>
        <input type="text" name="school" placeholder="Ваша школа" required>
        <select name="category" required>
            <option value="Вопрос">Вопрос</option>
            <option value="Предложение">Предложение</option>
            <option value="Благодарность">Благодарность</option>
            <option value="Жалоба">Жалоба</option>
        </select>
        <textarea name="text" rows="4" placeholder="Ваше сообщение" required></textarea>
        <button type="submit">Отправить</button>
    </form>
</body>
</html>
