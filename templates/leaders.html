<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Таблица лидеров</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: auto; text-align: center; background-color: black;font-family: 'Courier New', monospace;}
        .message { border: 1px solid #ccc; padding: 12px; margin-bottom: 10px; border-radius: 6px; }
        .category { font-weight: bold; color: #ffcc00; }
        .date { font-size: 12px; color: #888; }
        button{ font-weight: bold; color: #000000; background-color: #ffcc00;}
        .premium {
            color: #ffcc00;
            font-weight: bold;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #fff;
            z-index: 1000;
            background-color: #ffcc00;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <a href="/feedback" style="color: #000000; text-underline-offset: auto; text-decoration: none;">Написать новое</a>
        <a href="/promo" style="color: #000000; text-underline-offset: auto; text-decoration: none;">Ввести промокод</a>
        <p></p>
        <a href="/tops" style="color: #000000; text-underline-offset: auto; text-decoration: none;">Лучшие авторы</a>
        <a href="https://t.me/+Al3PSSStlsM2ZmIy" style="color: #000000; text-underline-offset: auto; text-decoration: none;">Наш телеграмм канал</a>
    </header>
    <h1 style="color: #ffcc00;">Лучшие авторы</h1>
    <div class="container">
                
                <!-- Элемент для сообщения (будет отображать data.message) -->
                
                <!-- Элемент для контента -->
        <div id="content">
                    <!-- Сюда будет вставляться полный блок -->
        </div>
    </div>
</body>
<script>
            async function list() {
                try {
                    const response = await fetch('/topsSHOW', {
                        method: 'POST',
                        headers: { 
                            "Accept": "application/json", 
                            "Content-Type": "application/json"
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        
                        // В message вставляем data.message
                        const messageElement = document.getElementById("message");
                        if (messageElement) {
                            messageElement.textContent = data.message;
                        }
                        
                        // В content вставляем полный блок
                        const contentElement = document.getElementById('content');
                        if (contentElement) {
                            contentElement.innerHTML = `
                                ${data.message}
                            `;
                        }
                    } else {
                        const error = await response.json();
                        alert(error.detail || 'Ошибка авторизации');
                    }
                } catch (e) {
                    console.error('Ошибка:', e);
                    alert('Произошла ошибка при выполнении запроса: ' + e.message);
                }
            }

            document.addEventListener('DOMContentLoaded', list);
        </script>
</html>
