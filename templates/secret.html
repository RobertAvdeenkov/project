<!DOCTYPE html>
<html>
<head>
    <title>Чат</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>

    body { font-family: Arial; padding: 20px; max-width: 600px; margin: auto; background-color: #000000;font-family: 'Courier New', monospace;}
    input, textarea, select { width: 100%; padding: 8px; margin: 5px 0; color: #ffcc00; background-color: #262626;}
    button{ font-weight: bold; color: #000000; background-color: #ffcc00;}
    button:hover { background: #262626; }

    #chat {
    border: 1px solid #ccc;
    height: 300px;
    overflow-y: auto;
    padding: 10px;
    background: #1a1a1a;
    color: #ffcc00;
}

    #chat div {
        color: #ffcc00;
        border-bottom: 1px solid #333;
        padding: 5px 0;
    }
</style>
<body>
    <div id="chat" style="border:1px solid #ccc; height:300px; overflow-y:auto; padding:10px;"></div>
    <input id="msg" type="text" placeholder="Сообщение">
    <button onclick="send()">Отправить</button>
    <button onclick="closecon()">Отключиться</button>


    <script>
        const ws = new WebSocket('/chatws');
        const chat = document.getElementById('chat');
        const input = document.getElementById('msg');

        ws.onmessage = function(e) {
            const div = document.createElement('div');
            div.textContent = e.data;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        };

        function send() {
            const text = input.value.trim();
            if (!text) return;
            ws.send(text);
            input.value = '';
        }

        function closecon(){
            if (!confirm('Уже уходишь?')){return;}
            ws.close()
        }

        ws.onclose=function() {
            window.location.href='/mainpage'
        }
    </script>
</body>
</html>
