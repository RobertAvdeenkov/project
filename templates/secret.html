<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Чат</title>
</head>
<style>

    body { font-family: Arial; padding: 20px; max-width: 600px; margin: auto; }
    input, textarea, select { width: 100%; padding: 8px; margin: 5px 0; }
    button{ font-weight: bold; color: #ffffff; background-color: #15590d;}
    button:hover { background: #1f7a14; }
</style>
<body>
    <div id="chat" style="border:1px solid #ccc; height:300px; overflow-y:auto; padding:10px;"></div>
    <input id="msg" type="text" placeholder="Сообщение">
    <button onclick="send()">Отправить</button>
    <button onclick="closecon()">Отключиться</button>


    <script>
        const ws = new WebSocket('/chatws');
        const chat = document.getElementById('chat');
        const input = document.getElementById('msg');

        ws.onmessage = function(e) {
            const div = document.createElement('div');
            div.textContent = e.data;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        };

        function send() {
            const text = input.value.trim();
            if (!text) return;
            ws.send(text);
            input.value = '';
        }

        function closecon(){
            if (!confirm('Уже уходишь?')){return;}
            ws.close()
        }

        ws.onclose=function() {
            window.location.href='/mainpage'
        }
    </script>
</body>
</html>
